apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop-app
  labels:
    app.kubernetes.io/name: globalshop
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: globalshop
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: globalshop
        app.kubernetes.io/component: web
    spec:
      terminationGracePeriodSeconds: 45
      initContainers:
        - name: wait-for-postgres
          image: postgres:17-alpine
          command:
            - sh
            - -ec
            - |
              until pg_isready -h globalshop-postgres -p 5432 -U globalshop -d globalshop; do
                echo "Waiting for globalshop-postgres..."
                sleep 3
              done
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
      containers:
        - name: globalshop
          # Replaced by the image transformer during CI/CD.
          image: globalshop-app:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: globalshop-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: globalshop-secrets
                  key: DB_PASSWORD
            - name: ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: globalshop-secrets
                  key: ADMIN_API_KEY
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
