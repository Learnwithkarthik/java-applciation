apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: globalshop-postgres
  labels:
    app.kubernetes.io/name: globalshop
    app.kubernetes.io/component: database
spec:
  serviceName: globalshop-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: globalshop
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: globalshop
        app.kubernetes.io/component: database
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: globalshop
            - name: POSTGRES_USER
              value: globalshop
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: globalshop-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U globalshop -d globalshop"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-ec", "pg_isready -U globalshop -d globalshop"]
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      securityContext:
        seccompProfile:
          type: RuntimeDefault
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
