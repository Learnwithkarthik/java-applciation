apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-deployment.yaml
  - app-service.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml

configMapGenerator:
  - name: globalshop-config
    literals:
      - DB_URL=jdbc:postgresql://globalshop-postgres:5432/globalshop
      - DB_USER=globalshop
      - PORT=8080
      - SEED_DEMO_DATA=true
