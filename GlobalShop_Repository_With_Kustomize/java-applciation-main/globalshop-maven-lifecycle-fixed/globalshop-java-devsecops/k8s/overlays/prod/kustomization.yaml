apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: globalshop-prod

labels:
  - pairs:
      environment: prod
    includeTemplates: true

# The app seeds demo products at startup; bootstrap a new DB with 1 web
# replica, then change count to 3 and re-apply after the first ready.
replicas:
  - name: globalshop-app
    count: 1

configMapGenerator:
  - name: globalshop-config
    behavior: merge
    literals:
      - APP_ENV=prod

patches:
  - path: app-resources.yaml
  - path: postgres-resources.yaml
