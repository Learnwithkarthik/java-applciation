apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop
spec:
  replicas: 1
  template:
    spec:
      containers:
        - name: globalshop
          env:
            - name: SEED_DEMO_DATA
              value: "false"
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 1Gi
