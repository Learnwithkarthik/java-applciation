apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop
  labels:
    app: globalshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globalshop
  template:
    metadata:
      labels:
        app: globalshop
    spec:
      containers:
        - name: globalshop
          image: karthikeya91101/myapp:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_URL
              value: "jdbc:h2:mem:globalshop;DB_CLOSE_DELAY=-1"
            - name: SEED_DEMO_DATA
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
