# Requires a CNI that enforces NetworkPolicy (such as Calico).
# Apply only AFTER the baseline stack works. Allows frontend->backend->database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-only-from-backend
  namespace: globalshop-3tier
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: globalshop-backend
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-only-from-frontend
  namespace: globalshop-3tier
spec:
  podSelector:
    matchLabels:
      app: globalshop-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: globalshop-frontend
      ports:
        - protocol: TCP
          port: 8080
