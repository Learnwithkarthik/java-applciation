# Requires an installed ingress controller. Change ingressClassName as needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: globalshop
  namespace: globalshop-3tier
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
