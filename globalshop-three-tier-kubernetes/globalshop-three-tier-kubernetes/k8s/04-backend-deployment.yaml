apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: globalshop-3tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globalshop-backend
  template:
    metadata:
      labels:
        app: globalshop-backend
        tier: backend
    spec:
      containers:
        - name: java
          image: karthikeya91101/globalshop-backend:3tier-v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres-service:5432/globalshop
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: globalshop-db-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: globalshop-db-credentials
                  key: POSTGRES_PASSWORD
            - name: ADMIN_API_KEY
              value: change-me-admin-key
            - name: SEED_DEMO_DATA
              value: "true"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
