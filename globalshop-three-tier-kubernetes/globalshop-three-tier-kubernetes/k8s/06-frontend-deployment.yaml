apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: globalshop-3tier
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globalshop-frontend
  template:
    metadata:
      labels:
        app: globalshop-frontend
        tier: frontend
    spec:
      containers:
        - name: nginx
          image: karthikeya91101/globalshop-frontend:3tier-v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
