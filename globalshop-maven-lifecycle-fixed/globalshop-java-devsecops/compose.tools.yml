# Optional isolated DevSecOps lab tools. Start one profile at a time if RAM is limited.
name: globalshop-lab-tools
services:
  nexus:
    image: sonatype/nexus3:latest
    profiles: ["nexus"]
    ports: ["8081:8081"]
    volumes: ["nexus-data:/nexus-data"]
    restart: unless-stopped
  sonar-db:
    image: postgres:17-alpine
    profiles: ["sonar"]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: local-sonar-db-password
      POSTGRES_DB: sonar
    volumes: ["sonar-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  sonarqube:
    image: sonarqube:community
    profiles: ["sonar"]
    ports: ["9000:9000"]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: local-sonar-db-password
    depends_on:
      sonar-db:
        condition: service_healthy
    volumes:
      - sonar-data:/opt/sonarqube/data
      - sonar-extensions:/opt/sonarqube/extensions
      - sonar-logs:/opt/sonarqube/logs
    restart: unless-stopped
volumes:
  nexus-data:
  sonar-postgres:
  sonar-data:
  sonar-extensions:
  sonar-logs:
