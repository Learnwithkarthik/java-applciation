apiVersion: v1
kind: Pod
metadata:
  name: globalshop-secure
  namespace: psa-restricted-demo
spec:
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: globalshop
      image: karthikeya91101/myapp:v2
      ports:
        - containerPort: 8080
      env:
        - name: DB_URL
          value: jdbc:h2:mem:globalshop;DB_CLOSE_DELAY=-1
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        capabilities:
          drop: ["ALL"]
