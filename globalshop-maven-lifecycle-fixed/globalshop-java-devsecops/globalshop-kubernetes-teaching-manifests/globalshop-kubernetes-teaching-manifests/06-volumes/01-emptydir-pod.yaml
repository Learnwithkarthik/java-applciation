apiVersion: v1
kind: Pod
metadata:
  name: globalshop-emptydir
  namespace: globalshop
spec:
  containers:
    - name: globalshop
      image: karthikeya91101/myapp:v2
      env:
        - name: DB_URL
          value: jdbc:h2:file:/opt/app/data/globalshop;DB_CLOSE_ON_EXIT=FALSE
      volumeMounts:
        - name: app-data
          mountPath: /opt/app/data
  volumes:
    - name: app-data
      emptyDir: {}
