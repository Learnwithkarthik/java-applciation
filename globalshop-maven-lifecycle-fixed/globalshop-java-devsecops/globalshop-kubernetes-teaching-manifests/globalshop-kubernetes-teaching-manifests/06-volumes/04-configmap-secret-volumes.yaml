apiVersion: v1
kind: Pod
metadata:
  name: config-volume-demo
  namespace: globalshop
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.37
      command: ["sh", "-c", "echo CONFIG; cat /config/PORT; echo SECRET; cat /secret/ADMIN_API_KEY; sleep 3600"]
      volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: secret
          mountPath: /secret
          readOnly: true
  volumes:
    - name: config
      configMap:
        name: globalshop-config
    - name: secret
      secret:
        secretName: globalshop-secret
