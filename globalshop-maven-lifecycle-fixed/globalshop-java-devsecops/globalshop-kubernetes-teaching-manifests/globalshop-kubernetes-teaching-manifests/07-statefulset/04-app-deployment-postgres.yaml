apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop
  namespace: globalshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: globalshop
  template:
    metadata:
      labels:
        app: globalshop
    spec:
      containers:
        - name: globalshop
          image: karthikeya91101/myapp:v2
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/globalshop
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: ADMIN_API_KEY
              value: dev-only-change-me
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
