apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: globalshop-paths
  namespace: globalshop
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: globalshop-service
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: globalshop-service
                port:
                  number: 8080
