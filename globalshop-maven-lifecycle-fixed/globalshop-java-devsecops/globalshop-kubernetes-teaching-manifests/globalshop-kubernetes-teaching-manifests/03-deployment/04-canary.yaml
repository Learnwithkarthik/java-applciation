# Canary demo: both Deployments match the same Service selector.
# Both tracks use the same known-good image by default; replace the stable image with an older tag for a visible version difference.
# With 3 stable replicas + 1 canary replica, traffic is approximately 75/25.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop-stable
  namespace: globalshop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: globalshop-canary
      track: stable
  template:
    metadata:
      labels:
        app: globalshop-canary
        track: stable
    spec:
      containers:
        - name: globalshop
          image: karthikeya91101/myapp:v2
          ports:
            - containerPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop-canary
  namespace: globalshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: globalshop-canary
      track: canary
  template:
    metadata:
      labels:
        app: globalshop-canary
        track: canary
    spec:
      containers:
        - name: globalshop
          image: karthikeya91101/myapp:v2
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: globalshop-canary-service
  namespace: globalshop
spec:
  selector:
    app: globalshop-canary
  ports:
    - port: 8080
      targetPort: 8080
