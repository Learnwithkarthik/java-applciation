apiVersion: v1
kind: Pod
metadata:
  name: globalshop-init-demo
  namespace: globalshop
spec:
  initContainers:
    - name: prepare-data
      image: busybox:1.37
      command: ["sh", "-c", "echo initialized-at=$(date) > /work/init.txt"]
      volumeMounts:
        - name: work
          mountPath: /work
  containers:
    - name: globalshop
      image: karthikeya91101/myapp:v2
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: work
          mountPath: /opt/app/init-demo
  volumes:
    - name: work
      emptyDir: {}
