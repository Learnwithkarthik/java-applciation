apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: globalshop
  namespace: globalshop
spec:
  parentRefs:
    - name: globalshop-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: globalshop-service
          port: 8080
