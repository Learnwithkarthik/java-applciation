# Advanced Gateway API canary: requires two Services named globalshop-v1 and globalshop-v2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: globalshop-weighted
  namespace: globalshop
spec:
  parentRefs:
    - name: globalshop-gateway
  rules:
    - backendRefs:
        - name: globalshop-v1
          port: 8080
          weight: 90
        - name: globalshop-v2
          port: 8080
          weight: 10
