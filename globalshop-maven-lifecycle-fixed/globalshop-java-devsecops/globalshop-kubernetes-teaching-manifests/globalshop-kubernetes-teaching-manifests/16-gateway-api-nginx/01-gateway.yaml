# Requires Gateway API CRDs and NGINX Gateway Fabric.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: globalshop-gateway
  namespace: globalshop
spec:
  gatewayClassName: nginx
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
