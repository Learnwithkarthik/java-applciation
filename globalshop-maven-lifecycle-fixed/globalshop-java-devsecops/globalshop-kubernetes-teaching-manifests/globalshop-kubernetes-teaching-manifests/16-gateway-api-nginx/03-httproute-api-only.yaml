# API Gateway-style route: expose only /api through this route.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: globalshop-api
  namespace: globalshop
spec:
  parentRefs:
    - name: globalshop-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: globalshop-service
          port: 8080
