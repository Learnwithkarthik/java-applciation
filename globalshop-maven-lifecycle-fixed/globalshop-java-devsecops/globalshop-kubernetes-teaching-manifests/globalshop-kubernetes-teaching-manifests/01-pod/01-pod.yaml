apiVersion: v1
kind: Pod
metadata:
  name: globalshop-pod
  namespace: globalshop
  labels:
    app: globalshop
spec:
  containers:
    - name: globalshop
      image: karthikeya91101/myapp:v2
      imagePullPolicy: IfNotPresent
      ports:
        - name: http
          containerPort: 8080
      env:
        - name: PORT
          value: "8080"
        - name: SEED_DEMO_DATA
          value: "true"
      readinessProbe:
        httpGet:
          path: /actuator/health
          port: http
        initialDelaySeconds: 10
        periodSeconds: 5
      livenessProbe:
        httpGet:
          path: /actuator/health
          port: http
        initialDelaySeconds: 20
        periodSeconds: 10
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
