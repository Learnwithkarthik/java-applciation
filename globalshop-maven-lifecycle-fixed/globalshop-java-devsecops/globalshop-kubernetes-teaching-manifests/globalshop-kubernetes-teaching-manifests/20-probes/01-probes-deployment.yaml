apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop-probes
  namespace: globalshop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: globalshop-probes
  template:
    metadata:
      labels:
        app: globalshop-probes
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: globalshop
          image: karthikeya91101/myapp:v2
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
