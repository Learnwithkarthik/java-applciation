apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: globalshop-rs
  namespace: globalshop
  labels:
    app: globalshop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: globalshop
      managed-by: replicaset
  template:
    metadata:
      labels:
        app: globalshop
        managed-by: replicaset
    spec:
      containers:
        - name: globalshop
          image: karthikeya91101/myapp:v2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
