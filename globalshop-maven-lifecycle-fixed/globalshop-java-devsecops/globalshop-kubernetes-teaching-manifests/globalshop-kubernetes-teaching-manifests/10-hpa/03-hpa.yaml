apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: globalshop-hpa
  namespace: globalshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: globalshop-hpa
  minReplicas: 2
  maxReplicas: 8
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
