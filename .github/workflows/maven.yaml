name: Semgrep Security Scan

on:
  push:
    branches:
      - main

jobs:
  semgrep-scan:
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    defaults:
      run:
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Semgrep Community Scan
        run: |
          semgrep scan \
            --config auto \
            --metrics=off \
            src/main/java

      - name: GlobalShop Security Policy Scan
        run: |
          semgrep scan \
            --config .semgrep/globalshop-rules.yml \
            --metrics=off \
            --error \
            src/main/java
