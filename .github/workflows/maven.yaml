name: Maven Build

on:
  push:
    branches:
      - main

jobs:
  maven-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Build Application
        run: mvn clean package
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

      - name: Maven Test
        run: mvn -B -ntp clean verify
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn -B -ntp clean verify
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -Dsonar.projectKey=GlobalShop-Java \
            -Dsonar.projectName="GlobalShop Java" \
            -Dsonar.host.url=https://6ae97b6a154749dc910414e1-4bc54f.node-ap-c7ae.iximiuz.com \
            -Dsonar.token=${SONAR_TOKEN}
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops
