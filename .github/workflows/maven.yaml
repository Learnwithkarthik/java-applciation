name: Maven Build

on:
  push:
    branches:
      - main

jobs:
  maven-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: nexus-snapshots
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      - name: Maven Build and Tests
        run: mvn -B -ntp clean verify
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

      - name: Build Application
        run: mvn clean package
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

      # - name: Test Nexus Authentication and Deploy
      #   env:
      #     NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      #     NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
      #     NEXUS_URL: ${{ vars.NEXUS_URL }}
      #   run: |
      #     mvn deploy \
      #       -DskipTests \
      #       -Pnexus-deploy \
      #       -DnexusUrl=$NEXUS_URL
      #   working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

      - name: SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B -ntp \
            org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey=globalShop-java \
            -Dsonar.qualitygate.wait=true
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops
