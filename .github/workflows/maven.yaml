
name: GlobalShop Maven and Semgrep CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  maven-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

    steps:
      # Step 1 - Checkout source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2 - Configure Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops/pom.xml

      # Step 3 - Maven build and unit tests
      - name: Build Application
        run: mvn -B clean package

      # Step 4 - Semgrep SAST scan
      - name: Semgrep Security Scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            semgrep/semgrep:1.182.1 \
            semgrep scan \
            --config p/default \
            --metrics=off \
            --error \
            src/main/java
