name: GCP WIF Authentication Test

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify Authentication
        run: |
          gcloud auth list
          gcloud config get-value project
          gcloud auth print-access-token > /dev/null
          echo "GCP authentication successful"
       - name: Docker verification
         run: |
             docker --version

      # - name: Configure Docker
      #   run: |
      #     gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # - name: Build Docker Image
      #   run: |
      #     docker build \
      #       -t us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docker-sample/globalshop-java:latest \
      #       ./globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

      - name: Push Docker Image
        run: |
          docker push \
            us-central1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docker-sample/globalshop-java:latest
