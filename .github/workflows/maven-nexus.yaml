name: GlobalShop Maven Build

on:
  push:
    branches: [main]

jobs:
  maven-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Application
        run: mvn clean package
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops
      - name: Upload JAR to Nexus
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ vars.NEXUS_URL }}
        run: |
          mvn deploy -DskipTests \
            -Pnexus-deploy \
            "-DnexusUrl=$NEXUS_URL"
