
name: GlobalShop Maven Build and Nexus

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  maven-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: globalshop-maven-lifecycle-fixed/globalshop-java-devsecops

    steps:
      # Step 1: Download the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java and configure Maven credentials
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          server-id: nexus-snapshots
          server-username: NEXUS_USERNAME
          server-password: NEXUS_PASSWORD

      # Step 3: Build the Java application
      - name: Build Application
        run: mvn clean package

      # Step 4: Check Nexus connectivity and authentication
      - name: Test Nexus Authentication
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ vars.NEXUS_URL }}
        run: |
          curl --silent --show-error \
            --output /dev/null \
            --write-out "Nexus HTTP Status: %{http_code}\n" \
            --user "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            "$NEXUS_URL/service/rest/v1/repositories"

      # Step 5: Upload the JAR to Nexus
      - name: Upload JAR to Nexus
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
          NEXUS_URL: ${{ vars.NEXUS_URL }}
        run: |
          mvn deploy -DskipTests \
            -Pnexus-deploy \
            "-DnexusUrl=$NEXUS_URL"
