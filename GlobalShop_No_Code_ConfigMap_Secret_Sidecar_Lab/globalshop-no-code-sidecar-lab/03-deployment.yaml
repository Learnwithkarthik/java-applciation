apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop-sidecar-demo
  namespace: globalshop
spec:
  replicas: 1 # LAB: file-based H2 database must not be used for multi-replica production workloads
  selector:
    matchLabels:
      app: globalshop-sidecar-demo
  template:
    metadata:
      labels:
        app: globalshop-sidecar-demo
    spec:
      securityContext:
        fsGroup: 2000
      volumes:
        - name: shared-logs
          emptyDir: {}
      containers:
        - name: java-app
          image: karthikeya91101/myapp:v2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: globalshop-sidecar-config
            - secretRef:
                name: globalshop-sidecar-secret
          volumeMounts:
            - name: shared-logs
              mountPath: /shared/logs
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 768Mi
        - name: log-processor
          image: busybox:1.36
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "Sidecar started; watching /shared/logs/globalshop.log"
              while [ ! -f /shared/logs/globalshop.log ]; do sleep 2; done
              touch /shared/logs/events.log
              tail -n +1 -F /shared/logs/globalshop.log | while IFS= read -r line; do
                case "$line" in
                  *"Started "*|*" ERROR "*|*" WARN "*|*" DEBUG "*)
                    printf '%s\n' "$line" >> /shared/logs/events.log
                    echo "CAPTURED: $line"
                    ;;
                esac
              done
          volumeMounts:
            - name: shared-logs
              mountPath: /shared/logs
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 96Mi
