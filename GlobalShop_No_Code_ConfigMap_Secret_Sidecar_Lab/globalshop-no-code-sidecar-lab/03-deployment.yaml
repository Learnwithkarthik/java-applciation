apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        # Main Java Application
        - name: java-app
          image: karthikeya91101/myapp:v2
          ports:
            - containerPort: 8080
          env:
            - name: LOGGING_FILE_NAME
              value: /shared/app.log
          volumeMounts:
            - name: shared-data
              mountPath: /shared

        # Sidecar Container
        - name: log-sidecar
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              touch /shared/app.log
              tail -n +1 -F /shared/app.log
          volumeMounts:
            - name: shared-data
              mountPath: /shared

      volumes:
        - name: shared-data
          emptyDir: {}
