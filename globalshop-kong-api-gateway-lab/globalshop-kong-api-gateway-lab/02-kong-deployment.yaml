apiVersion: apps/v1
kind: Deployment
metadata:
  name: globalshop-kong
  namespace: globalshop
spec:
  # One replica deliberately: local rate-limit counters are per-instance.
  replicas: 1
  selector:
    matchLabels:
      app: globalshop-kong
  template:
    metadata:
      labels:
        app: globalshop-kong
    spec:
      containers:
        - name: kong
          image: kong:3.9.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "127.0.0.1:8001"
            - name: KONG_NGINX_WORKER_PROCESSES
              value: "2"
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong/kong.yml
              subPath: kong.yml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          readinessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: proxy
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: kong-config
          configMap:
            name: globalshop-kong-config
