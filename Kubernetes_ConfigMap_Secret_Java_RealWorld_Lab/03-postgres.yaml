apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-postgres
  namespace: shop-demo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shop-postgres
  template:
    metadata:
      labels:
        app: shop-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: globalshop
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: shop-config
                  key: DB_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shop-secret
                  key: DB_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}  # LAB ONLY: data is lost when this Pod is replaced.
---
apiVersion: v1
kind: Service
metadata:
  name: shop-postgres
  namespace: shop-demo
spec:
  selector:
    app: shop-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
